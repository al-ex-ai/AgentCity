# /etc/nginx/sites-enabled/agentcity.al-ex.ai
# Static viewer behind Cloudflare (Full Strict) with the shared origin certificate. Same shape as the other al-ex.ai static sites.
server {
    listen 443 ssl http2;
    server_name agentcity.al-ex.ai;

    ssl_certificate     /etc/nginx/ssl/al-ex.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/al-ex.ai.key;

    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/agentcity/viewer;
    index index.html;

    # Locations that add their own headers must repeat the security headers (nginx does not inherit them).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location /gallery/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}

server {
    listen 80;
    server_name agentcity.al-ex.ai;
    return 301 https://$host$request_uri;
}
