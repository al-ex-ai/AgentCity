# /etc/nginx/sites-enabled/agentcity.al-ex.ai
# Static viewer behind Cloudflare (Full Strict) with the shared origin certificate.
server {
    listen 80;
    listen [::]:80;
    server_name agentcity.al-ex.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agentcity.al-ex.ai;

    ssl_certificate     /etc/nginx/ssl/al-ex.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/al-ex.ai.key;

    root /var/www/agentcity/viewer;
    index index.html;

    include snippets/security-headers.conf;

    # The viewer reads city.json files from gallery/ and the user's own disk only.
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location /gallery/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}
