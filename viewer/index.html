<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent City</title>
  <meta name="description" content="A 3D city of a codebase that shows where coding agents write the code and what it costs afterwards.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M0 0h16v16z' fill='%23ffa24a'/%3E%3Cpath d='M0 0v16h16z' fill='%234f6d8f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/" } }
  </script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span>Agent City</span>
      </div>
      <div class="repo" id="repo"></div>
      <div class="actions">
        <label class="btn" for="file">Open city.json</label>
        <input id="file" type="file" accept=".json,application/json" hidden>
      </div>
    </header>

    <section class="verdicts" id="verdicts" aria-label="Key findings"></section>

    <main class="main">
      <div class="stage" id="stage">
        <div class="layers" role="group" aria-label="Color the city by">
          <button type="button" data-layer="agent" aria-pressed="true">Agent share</button>
          <button type="button" data-layer="rework" aria-pressed="false">Rework</button>
          <button type="button" data-layer="verifier" aria-pressed="false">Verifier</button>
          <button type="button" data-layer="owners" aria-pressed="false">Owners</button>
          <button type="button" data-layer="era" aria-pressed="false" hidden>Since agents</button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip" hidden></div>
        <div class="empty" id="empty" hidden>
          <h1>Open a city</h1>
          <p>Run <code>npx agent-city &lt;repo&gt;</code> to analyze a repository, then open the <code>city.json</code> it writes. You can also drop the file here.</p>
          <label class="btn primary" for="file">Open city.json</label>
          <p class="err" id="err" hidden></p>
          <div class="gallery" id="gallery" hidden>
            <h2>Or explore an example</h2>
            <ul id="gallery-list"></ul>
          </div>
        </div>
      </div>
      <aside class="side" id="side" aria-label="Insights"></aside>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>
  <div class="drop" id="drop" hidden><span>Drop city.json</span></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
